org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.daemon.idletimeout=60000
android.useAndroidX=true
android.enableJetifier=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Fix Windows cross-drive path error between C: (Pub cache) and D: (Workspace)
kotlin.incremental=false
kotlin.incremental.android=false
kotlin.incremental.useClasspathSnapshot=false
kotlin.caching.enabled=false
org.gradle.caching=false

# ar_flutter_plugin uses Sceneform 1.17.1 which has sceneform-base and sceneform:core
# sharing the namespace 'com.google.ar.sceneform'. This disables AGP's strict enforcement.
android.uniqueNamespaces=false
